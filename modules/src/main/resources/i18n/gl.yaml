# General ledger (docs/ARCHITECTURE.md §23.5). UTF-8.
# Each key lists its texts by language. error.* and status.* are French only: English is the code's own message.

module.gl:
  en: General ledger
  fr: Grand livre

glAccount:
  en: Accounts
  fr: Comptes
glAccount.one:
  en: Account
  fr: Compte
glAccount.field.accountNo:
  en: Account no.
  fr: No de compte
glAccount.field.accountType:
  en: Type
  fr: Type
glAccount.field.parentId:
  en: Heading
  fr: Regroupement
glAccount.field.isHeading:
  en: Heading account
  fr: Compte de regroupement
glAccount.field.manualPosting:
  en: Manual entries allowed
  fr: Écritures manuelles permises

enum.AccountType.ASSET:
  en: Asset
  fr: Actif
enum.AccountType.LIABILITY:
  en: Liability
  fr: Passif
enum.AccountType.EQUITY:
  en: Equity
  fr: Capitaux propres
enum.AccountType.REVENUE:
  en: Revenue
  fr: Produits
enum.AccountType.EXPENSE:
  en: Expense
  fr: Charges

