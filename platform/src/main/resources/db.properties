# Database configuration for Stempy ERP Server

database.pool.name=stempy-erp
database.pool.maxSize=10
database.pool.minIdle=2
database.pool.connectionTimeoutMs=30000
# Logs a stack trace when a connection is held longer than this (0 = off).
database.pool.leakDetectionThresholdMs=2000
# A second, separate pool for short transactions opened while a caller holds a connection
# (GAPS_ALLOWED numbers, new number counters, new GL dimension sets): UnitOfWorkFactory.autonomous().
database.autonomousPool.maxSize=4

# Development defaults. In production set DATABASE_USE_SSL=true (or DATABASE_SSL_MODE=VERIFY_IDENTITY)
# and DATABASE_ALLOW_PUBLIC_KEY_RETRIEVAL=false in the environment (DatabaseConfig.from).
database.url.params.useSSL=false
database.url.params.allowPublicKeyRetrieval=true
# Instants are bound and read as UTC, and the session's time zone is forced to UTC so that
# DEFAULT CURRENT_TIMESTAMP, NOW() and UTC_TIMESTAMP() agree with them whatever the server's zone.
database.url.params.connectionTimeZone=UTC
database.url.params.forceConnectionTimeZoneToSession=true

# JDBC driver properties set on the pool (DatabaseConfig.driverProperties).
database.mysql.performance.settings.cachePrepStmts=true
database.mysql.performance.settings.prepStmtCacheSize=250
database.mysql.performance.settings.prepStmtCacheSqlLimit=2048
database.mysql.performance.settings.useServerPrepStmts=true
database.mysql.performance.settings.rewriteBatchedStatements=true
