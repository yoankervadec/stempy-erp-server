# Database configuration for Stempy ERP Server

database.pool.name=stempy-erp
database.pool.maxSize=6
database.pool.minIdle=2
database.connection-timeoutMs=30000
database.leakDetectionThresholdMs=2000

database.url.params.useSSL=false
database.url.params.allowPublicKeyRetrieval=true
database.url.params.serverTimezone=UTC

database.mysql.performance.settings.cachePrepStmts=true
database.mysql.performance.settings.prepStmtCacheSize=250
database.mysql.performance.settings.prepStmtCacheSqlLimit=2048
database.mysql.performance.settings.useServerPrepStmts=true
database.mysql.performance.settings.rewriteBatchedStatements=true
