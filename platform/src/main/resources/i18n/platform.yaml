# Platform texts (docs/ARCHITECTURE.md §23.5). UTF-8.
# Each key lists its texts by language. error.* and status.* are French only: English is the code's own message.

# Labels shared by every resource; a resource's own <key>.field.<name> wins over field.<name>.

field.id:
  en: Id
  fr: Id
field.version:
  en: Version
  fr: Version
field.createdAt:
  en: Created at
  fr: Créé le
field.createdBy:
  en: Created by
  fr: Créé par
field.updatedAt:
  en: Updated at
  fr: Modifié le
field.updatedBy:
  en: Updated by
  fr: Modifié par
field.deletedAt:
  en: Deleted at
  fr: Supprimé le
field.code:
  en: Code
  fr: Code
field.name:
  en: Name
  fr: Nom
field.description:
  en: Description
  fr: Description
field.isEnabled:
  en: Enabled
  fr: Actif

