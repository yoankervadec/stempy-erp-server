  fr: L'expression cron est invalide
error.INVALID_TIME_ZONE:
  fr: Fuseau horaire inconnu
error.NUMBER_SERIES_NOT_FOUND:
  fr: Aucune série de numérotation ne s'applique

# Server and framework
error.INTERNAL_ERROR:
  fr: Une erreur inattendue est survenue.
error.DATABASE_BUSY:
  fr: Le système est occupé. Réessayez.
error.BAD_REQUEST:
  fr: La requête est invalide.
error.METHOD_NOT_ALLOWED:
  fr: Cette méthode n'est pas permise pour cette adresse.
error.PAYLOAD_TOO_LARGE:
  fr: Le contenu envoyé est trop volumineux.
error.UNSUPPORTED_MEDIA_TYPE:
  fr: Ce type de contenu n'est pas pris en charge.
error.TOO_MANY_REQUESTS:
  fr: Trop de requêtes. Réessayez plus tard.

# Used by several modules
error.NOT_ROUNDED:
  fr: au plus {decimals} décimales en {currency}
error.FORBIDDEN:
  fr: Vous n'avez pas la permission de modifier ce champ
