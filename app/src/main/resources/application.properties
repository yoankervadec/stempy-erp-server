# Application properties for Stempy ERP Server

# Server
server.port=8080
# Browser origins allowed to call the API from another origin (CORS), comma-separated:
# the desktop client's page (e.g. app://stempy) or a dev server (http://localhost:5173).
# Full origins only, no '*'. Empty: none (the client calls from its main process, or same origin).
server.cors.origins=app://stempy,http://localhost:5173

# Authentication (ISO-8601 durations: PT8H = 8 hours, P7D = 7 days)
# A session ends after this much inactivity...
auth.session.idleTimeout=PT8H
# ...or this long after login, whichever comes first.
auth.session.maxLifetime=P7D
# Failed logins (per user + client IP) before refusing attempts for the lockout window.
auth.login.maxFailures=5
auth.login.lockout=PT15M
# How long a user's permissions in a company stay in memory. Changes made through
# the server apply at once; this bounds changes made outside it (SQL, CLI commands).
auth.permissions.cacheTtl=PT5M

# Scheduler (recurring jobs; schedules live in the scheduled_jobs table)
# false: this instance serves HTTP only and runs no jobs.
scheduler.enabled=true
# How often due schedules are looked for; an edit to a schedule takes effect within this delay.
scheduler.pollInterval=PT5S
# Jobs run at most this many at a time on this instance.
scheduler.workerThreads=4
# A claimed schedule stays locked this long without renewal (renewed every third of it while
# its job runs), so the runs of a crashed instance are taken over after about this long.
scheduler.lease=PT1M
# For job types and schedules that set no timeout.
scheduler.defaultTimeout=PT1H
# On shutdown, running jobs get this long to finish before being interrupted.
scheduler.shutdownGrace=PT30S
# Finished runs older than this are deleted by the scheduler.prune-runs job.
scheduler.runRetention=P90D

# Audit trail (audit_log table)
# Entries older than this are deleted by the audit.prune job. An ISO-8601 period (years allowed);
# at least P6Y: CRA and Revenu Quebec expect records kept 6 years after the year they relate to.
audit.retention=P7Y

# Outbox (async event handlers: emails, webhooks, ...; messages live in the outbox table)
# false: this instance delivers nothing (messages are still written; other instances deliver them).
outbox.enabled=true
# How often pending messages are looked for when idle.
outbox.pollInterval=PT1S
# Handlers run at most this many at a time on this instance.
outbox.workerThreads=4
# For async subscriptions that set none: one attempt is interrupted after this long.
outbox.defaultTimeout=PT30S
# For async subscriptions that set none: after this many failed attempts a message is DEAD.
outbox.defaultMaxAttempts=8
# Failed attempt n is retried after retryBackoff * 2^(n-1), capped at 1 hour.
outbox.retryBackoff=PT10S
# On shutdown, running handlers get this long to finish before being interrupted.
outbox.shutdownGrace=PT15S
# Delivered messages older than this are deleted by the outbox.prune job.
outbox.retention=P7D
# Dead messages older than this are deleted by the outbox.prune job.
outbox.deadRetention=P90D
